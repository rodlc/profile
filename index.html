<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodolphe Le Coent</title>
<meta name="description" content="Staff Product Manager and founder of Karkoi. Links to LinkedIn, GitHub, Karkoi and email">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a profile card then a 2 × 2 grid of links on lin, 640px, grège 1px separators. Karkoi palette, light only by design */
:root {
  color-scheme: light;
  --sauge: #29443A; --sauge-tint: #EEF3EF; --ocre: #C4985A;
  --encre: #1A1A18; --taupe: #6A645B; --grege: #E6E3DE;
  --lin: #F5F4EF; --white: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--lin); color: var(--encre); font: 400 14px/1.6 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ocre); outline-offset: 2px; }

.page { max-width: 640px; margin: 0 auto; padding-inline: max(28px, env(safe-area-inset-left, 0px)) max(28px, env(safe-area-inset-right, 0px)); padding-block: 72px; display: flex; flex-direction: column; gap: 32px; }

.profile { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.photo { width: 96px; height: 96px; border-radius: 99px; object-fit: cover; display: block; }
.name { font-size: 20px; font-weight: 600; color: var(--sauge); }
.role { color: var(--taupe); }

.links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--grege); border-radius: 8px; overflow: hidden; }
.link { background: var(--white); padding: 20px; display: grid; grid-template-columns: 1fr 16px; gap: 2px 12px; align-items: center; min-width: 0; transition: background .15s; }
.link:hover { background: var(--sauge-tint); }
.link-name { font-weight: 600; color: var(--sauge); }
.link-handle { color: var(--taupe); grid-column: 1; overflow-wrap: anywhere; }
.arrow { grid-column: 2; grid-row: 1 / span 2; width: 8px; height: 8px; border-top: 1.5px solid var(--ocre); border-right: 1.5px solid var(--ocre); transform: rotate(45deg); justify-self: center; transition: transform .15s; }
.link:hover .arrow { transform: translateX(2px) rotate(45deg); }

.footer { text-align: center; color: var(--taupe); }

@media (prefers-reduced-motion: reduce) { .link, .arrow { transition: none; } }
@media (max-width: 560px) {
  .page { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 48px; }
  .links { grid-template-columns: 1fr; }
  .link { padding: 16px; }
}
</style>
</head>
<body>
<main class="page">
  <header class="profile">
    <img class="photo" src="./shared/images/profile.png" alt="Rodolphe Le Coent">
    <h1 class="name">✌️ Rodolphe Le Coent</h1>
    <p class="role">Staff Product Manager · Founder @Karkoi</p>
  </header>

  <nav class="links" aria-label="Links">
    <a class="link" href="https://www.linkedin.com/in/rodlc/" target="_blank" rel="noopener"><span class="link-name">LinkedIn</span><span class="link-handle">in/rodlc</span><span class="arrow" aria-hidden="true"></span></a>
    <a class="link" href="https://karkoi.com" target="_blank" rel="noopener"><span class="link-name">Karkoi</span><span class="link-handle">karkoi.com</span><span class="arrow" aria-hidden="true"></span></a>
    <a class="link" href="https://github.com/rodlc" target="_blank" rel="noopener"><span class="link-name">GitHub</span><span class="link-handle">github.com/rodlc</span><span class="arrow" aria-hidden="true"></span></a>
    <a class="link" href="mailto:rodolphe@lecoent.net"><span class="link-name">Email</span><span class="link-handle">rodolphe@lecoent.net</span><span class="arrow" aria-hidden="true"></span></a>
  </nav>

  <footer class="footer">Lyon, France</footer>
</main>
</body>
</html>
