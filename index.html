<style>
/* Layout: a profile card then a 2 × 2 grid of links with their icon on lin, 640px, grège 1px separators. Karkoi palette, light only by design */
:root {
  color-scheme: light;
  --sauge: #29443A; --sauge-tint: #EEF3EF; --ocre: #C4985A;
  --encre: #1A1A18; --taupe: #6A645B; --grege: #E6E3DE;
  --lin: #F5F4EF; --white: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--lin); color: var(--encre); font: 400 14px/1.6 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ocre); outline-offset: 2px; }

.page { max-width: 640px; margin: 0 auto; padding-inline: max(28px, env(safe-area-inset-left, 0px)) max(28px, env(safe-area-inset-right, 0px)); padding-block: 72px; display: flex; flex-direction: column; gap: 32px; }

.profile { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.photo { width: 96px; height: 96px; border-radius: 99px; object-fit: cover; display: block; margin-bottom: 12px; }
.name { font-size: 20px; font-weight: 600; color: var(--sauge); }
.role { color: var(--taupe); }

.links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--grege); border-radius: 8px; overflow: hidden; }
.link { background: var(--white); padding: 20px; display: grid; grid-template-columns: 40px 1fr 16px; gap: 0 16px; align-items: center; min-width: 0; transition: background .15s; }
.link:hover { background: var(--sauge-tint); }
.icon { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 8px; background: var(--sauge-tint); display: grid; place-items: center; transition: background .15s; }
.link:hover .icon { background: var(--white); }
.icon svg { width: 20px; height: 20px; display: block; }
.icon .fill { fill: var(--sauge); }
.icon .stroke { fill: none; stroke: var(--sauge); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.link-name { font-weight: 600; color: var(--sauge); grid-column: 2; }
.link-handle { color: var(--taupe); grid-column: 2; overflow-wrap: anywhere; min-width: 0; }
.arrow { grid-column: 3; grid-row: 1 / span 2; width: 8px; height: 8px; border-top: 1.5px solid var(--ocre); border-right: 1.5px solid var(--ocre); transform: rotate(45deg); justify-self: center; transition: transform .15s; }
.link:hover .arrow { transform: translateX(2px) rotate(45deg); }

.footer { text-align: center; color: var(--taupe); text-wrap: balance; }
.heart { width: 14px; height: 14px; fill: var(--ocre); display: inline-block; vertical-align: -2px; margin: 0 2px; }

@media (prefers-reduced-motion: reduce) { .link, .icon, .arrow { transition: none; } }
@media (max-width: 560px) {
  .page { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 48px; }
  .links { grid-template-columns: 1fr; }
  .link { padding: 16px; }
}
</style>
